name: Bulk Historical Backfill (Run Once)

on:
  workflow_dispatch:   # ONLY manual trigger — run this once to seed ~300 historical records

permissions:
  contents: read

jobs:
  backfill:
    name: Bulk Backfill (300 articles, 12-month window)
    runs-on: ubuntu-latest
    timeout-minutes: 60   # backfill takes longer — up to 300 Gemini calls

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run bulk historical backfill
        run: python scripts/bulk_backfill.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
